name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release
        env:
          DERIVED: ${{ github.workspace }}/.derived-ci
          MACOSX_DEPLOYMENT_TARGET_CI: ${{ vars.MACOSX_DEPLOYMENT_TARGET_CI }}
          DEVELOPER_DIR_CI: ${{ vars.DEVELOPER_DIR_CI }}
        run: |
          set -eo pipefail
          echo "DERIVED_DATA_PATH=$DERIVED" >> "$GITHUB_ENV"

          DEFAULT_XCODE_DEV="/Applications/Xcode_26.4.1.app/Contents/Developer"
          export DEVELOPER_DIR="${DEVELOPER_DIR_CI:-$DEFAULT_XCODE_DEV}"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

          EXTRA_ARGS=()
          if [[ -n "${MACOSX_DEPLOYMENT_TARGET_CI:-}" ]]; then
            EXTRA_ARGS+=(MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET_CI")
          fi

          xcodebuild \
            -project "3DS FBI Server.xcodeproj" \
            -scheme "3DS FBI Server" \
            -configuration Release \
            -derivedDataPath "$DERIVED" \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            "${EXTRA_ARGS[@]}" \
            build

      - name: Package DMG
        run: |
          set -eo pipefail
          APP="${DERIVED_DATA_PATH}/Build/Products/Release/3DS FBI Server.app"
          if [[ ! -d "$APP" ]]; then
            echo "Built app not found at: $APP"
            find "${DERIVED_DATA_PATH}" -name '*.app' -maxdepth 6 2>/dev/null || true
            exit 1
          fi

          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -sf /Applications "$STAGING/Applications"

          DMG_NAME="3DS-FBI-Server-${{ github.ref_name }}.dmg"
          hdiutil create \
            -volname "3DS FBI Server" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          rm -rf "$STAGING"
          ls -la "$DMG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.dmg'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
