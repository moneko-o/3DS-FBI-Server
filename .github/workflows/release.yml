name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-dmg:
    name: DMG (${{ matrix.arch }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release (${{ matrix.arch }})
        env:
          DERIVED: ${{ github.workspace }}/.derived-${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET_CI: ${{ vars.MACOSX_DEPLOYMENT_TARGET_CI }}
          DEVELOPER_DIR_CI: ${{ vars.DEVELOPER_DIR_CI }}
        run: |
          set -eo pipefail
          echo "DERIVED_DATA_PATH=$DERIVED" >> "$GITHUB_ENV"

          DEFAULT_XCODE_DEV="/Applications/Xcode_26.4.1.app/Contents/Developer"
          export DEVELOPER_DIR="${DEVELOPER_DIR_CI:-$DEFAULT_XCODE_DEV}"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

          EXTRA_ARGS=()
          if [[ -n "${MACOSX_DEPLOYMENT_TARGET_CI:-}" ]]; then
            EXTRA_ARGS+=(MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET_CI")
          fi

          xcodebuild \
            -project "3DS FBI Server.xcodeproj" \
            -scheme "3DS FBI Server" \
            -configuration Release \
            -derivedDataPath "$DERIVED" \
            -destination 'generic/platform=macOS' \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            "${EXTRA_ARGS[@]}" \
            build

      - name: Package DMG
        env:
          DMG_NAME: 3DS-FBI-Server-${{ github.ref_name }}-${{ matrix.arch }}.dmg
        run: |
          set -eo pipefail
          APP="${DERIVED_DATA_PATH}/Build/Products/Release/3DS FBI Server.app"
          if [[ ! -d "$APP" ]]; then
            echo "Built app not found at: $APP"
            find "${DERIVED_DATA_PATH}" -name '*.app' -maxdepth 8 2>/dev/null || true
            exit 1
          fi

          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -sf /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "3DS FBI Server" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          rm -rf "$STAGING"
          ls -la "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: '*.dmg'
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-dmg
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
